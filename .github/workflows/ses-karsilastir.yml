# Ses karşılaştırma testi: farklı ücretsiz modellerle aynı cümleler. Sonuçlar geçici sürüme konur.
name: Ses karşılaştır

on:
  workflow_dispatch:
    inputs:
      modlar:
        description: 'Çalışacak modlar (JSON liste)'
        default: '["pocket","chatterbox"]'

permissions:
  contents: write

jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ses-testi-karsilastir-$(date +%m%d%H%M)"
          gh release create "$tag" --prerelease --title "Ses karşılaştırma" --notes "Geçici" --repo "${{ github.repository }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  uret:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.modlar || '["pocket","chatterbox"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Önbellek (ses modelleri)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ses-${{ matrix.model }}-v1
      - name: Kurulum
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          if [ "${{ matrix.model }}" = "pocket" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install pocket-tts-turkish
          else
            pip install chatterbox-tts huggingface_hub
          fi
      - name: Ses kaydını çöz
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          [ -n "$VOICE_KEY" ] && openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice/ref.wav.enc -out /tmp/ref.wav -pass env:VOICE_KEY || true
      - name: Üret
        run: python tools/ses_karsilastir.py ${{ matrix.model }} out
      - name: Sürüme ekle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f /tmp/ref.wav
          gh release upload "${{ needs.hazirla.outputs.tag }}" out/* --repo "${{ github.repository }}" || true
