# GEÇİCİ: rakip hesap keşfi (salt okuma, paylaşım yok)
name: Hesap ara (geçici)
on:
  workflow_dispatch:
    inputs:
      sorgular:
        description: "| ile ayrılmış aramalar"
        required: true
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SC_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: python3 tools/hesap_ara.py "${{ inputs.sorgular }}"
