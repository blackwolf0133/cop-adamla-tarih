# Çapkın Nihat: bir bölümün sesini üretir (Gemini TTS + kelime saatleri) ve depoya yazar.
name: Dizi sesi
on:
  workflow_dispatch:
    inputs:
      bolum:
        description: "Bölüm klasörü (dizi/stories altında, örn. D01)"
        required: true
permissions:
  contents: write
concurrency:
  group: dizi-ses-${{ inputs.bolum }}
  cancel-in-progress: false
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install numpy faster-whisper
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python dizi/tools/ses_uret.py dizi/stories/${{ inputs.bolum }}
      - name: Depoya yaz
        run: |
          git config user.name "dizi-robot"; git config user.email "dizi-robot@users.noreply.github.com"
          git add -f dizi/stories/${{ inputs.bolum }}/voice
          git commit -m "Dizi sesi: ${{ inputs.bolum }}" || echo "değişiklik yok"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
