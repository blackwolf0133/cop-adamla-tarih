# Geçici: @sonmola.dizi hesabının Instagram kimliğini bulur (sadece okuma, paylaşım yok). İşi bitince silinecek.
name: Hesap kimliği bul (geçici)
on:
  workflow_dispatch:
jobs:
  bul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, publisher as P
          t = os.environ["IG_ACCESS_TOKEN"]; m = P.detect_mode(t); uid = P.resolve_user_id(t, m)
          r = P._request("GET", f"https://{P._host(m)}/{P.API_VERSION}/{uid}",
                         {"fields": "business_discovery.username(sonmola.dizi){id,username}", "access_token": t})
          print("SONMOLA_KIMLIK", r.get("business_discovery"))
          PY
