# Bir çalıştırmanın artifact'ini geçici bir ön-sürüme taşır (Claude'un indirebilmesi için).
name: Artifact taşı

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Kaynak çalıştırma numarası"
        required: true
      ad:
        description: "Artifact adı"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.ad }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "onizleme-${{ inputs.ad }}-$(date +%H%M%S)" out/* --prerelease --title "Önizleme ${{ inputs.ad }}" --notes "Geçici" --repo "${{ github.repository }}"
