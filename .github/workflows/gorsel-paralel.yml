# Paralel çizim: her sahne ayrı makinede (FLUX.2-klein-4B, stable-diffusion.cpp CPU).
name: Görsel paralel

on:
  workflow_dispatch:
    inputs:
      model:
        default: "klein"

permissions:
  contents: write

jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="onizleme-paralel-$(date +%m%d%H%M)"
          gh release create "$tag" --prerelease --title "Paralel çizim" --notes "Geçici" --repo "${{ github.repository }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  ciz:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sahne: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Önbellek (sd.cpp)
        id: sdcache
        uses: actions/cache@v4
        with:
          path: ~/sdbin
          key: sdcpp-cpu-v1
      - name: stable-diffusion.cpp derle
        if: steps.sdcache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp /tmp/sd
          cmake -S /tmp/sd -B /tmp/sd/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build /tmp/sd/build --config Release -j4
          mkdir -p ~/sdbin && cp /tmp/sd/build/bin/* ~/sdbin/
      - name: Önbellek (modeller)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdcpp-${{ inputs.model }}-v1
      - run: pip install huggingface_hub
      - name: Çiz
        run: python tools/gorsel_test2.py ${{ inputs.model }} ~/sdbin/sd-cli out ${{ matrix.sahne }}
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.hazirla.outputs.tag }}" out/*.png --repo "${{ github.repository }}"
